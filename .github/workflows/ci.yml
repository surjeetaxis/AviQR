name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aviqr-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all 10 services + run unit tests
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: aviqr-backend/*/build/reports/tests
          retention-days: 7

  web:
    name: Web (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aviqr-ui-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aviqr-ui-web/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://api.aviqr.com

      - name: Upload dist (sanity artifact, not used for deploy)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: aviqr-ui-web/dist
          retention-days: 3

  mobile:
    name: Mobile (logic + component tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aviqr-mobile-expo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aviqr-mobile-expo/package-lock.json

      - run: npm ci
      - run: npm run test:logic
      - run: npm run test:components
