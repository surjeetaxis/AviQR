name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: security_test
          POSTGRES_DB: aviqr_security_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55486:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: aviqr-backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'


      - name: Build all 10 services + run unit tests
        run: ./gradlew build --no-daemon -PsecurityTestDbUrl=jdbc:postgresql://localhost:55486/aviqr_security_test

      - name: Verify encrypted backup and disposable restore
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client gnupg ripgrep
          AVIQR_SECURITY_TEST_PG_PORT=55486 bash deploy/security/test-backup-restore.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-test-reports
          path: aviqr-backend/*/build/reports/tests
          retention-days: 7

  web:
    name: Web (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aviqr-ui-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aviqr-ui-web/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://api.aviqr.com

      - name: Upload dist (sanity artifact, not used for deploy)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-dist
          path: aviqr-ui-web/dist
          retention-days: 3

  mobile:
    name: Mobile (logic + component tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aviqr-mobile-expo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aviqr-mobile-expo/package-lock.json

      - run: npm ci
      - run: npm run test:logic
      - run: npm run test:components

  deployment-gate-tests:
    name: Deployment gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node --test .github/scripts/*.test.mjs
