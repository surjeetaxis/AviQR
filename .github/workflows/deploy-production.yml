name: Deploy to Production
# Run the reviewed workflow from master; ref can select any branch/tag/commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag or commit to deploy
        required: false
        default: master
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  verify:
    name: Verify deployment commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Require reviewed master workflow
        env:
          CONTROL_REF: ${{ github.ref }}
        run: test "$CONTROL_REF" = refs/heads/master
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: target
          ref: ${{ inputs.ref || 'master' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve target SHA
        id: target
        run: echo "sha=$(git -C target rev-parse --verify 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CONTROL_SHA: ${{ github.sha }}
        with:
          script: |
            const {gateDeployment}=await import(`${process.env.GITHUB_WORKSPACE}/control/.github/scripts/gate-deployment.mjs`);
            await gateDeployment(github,{...context.repo,sha:process.env.TARGET_SHA,controlSha:process.env.CONTROL_SHA});
  deploy:
    name: Deploy (SSH + systemd)
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy verified SHA over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            bash /var/www/aviqr/aviqr-backend/deploy/deploy.sh "${{ needs.verify.outputs.sha }}"
      - name: Summary
        if: always()
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
