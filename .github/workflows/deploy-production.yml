name: Deploy to Production

# Manual only — on demand via workflow_dispatch (e.g. to deploy the current
# master, or to roll back to an older SHA by passing it as the `ref` input).
#
# Previously also auto-triggered via workflow_run after CI succeeded on
# master. Dropped: with deploys also happening by hand over SSH during
# active work on this repo, the two paths raced on the same /var/www/aviqr
# tree — confirmed live, redundant back-to-back deploys of the same commit,
# harmless only because deploy.sh's flock + the release/symlink model
# happened to already be in place by the time it was noticed. One trigger
# is one less way to end up with two deploys stepping on each other.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git SHA or branch/tag to deploy'
        required: false
        default: 'master'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (SSH + systemd)
    runs-on: ubuntu-latest
    # Requires a "production" Environment configured in repo Settings with
    # required reviewers — the job pauses here until someone approves it.
    environment: production
    steps:
      - name: Resolve ref to deploy
        id: ref
        run: echo "value=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            bash /var/www/aviqr/aviqr-backend/deploy/deploy.sh "${{ steps.ref.outputs.value }}"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy target" >> "$GITHUB_STEP_SUMMARY"
          echo "Ref: \`${{ steps.ref.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
