name: Deploy to Production

# Manual deployment of any branch, tag or commit, with production approval.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git SHA or branch/tag to deploy'
        required: false
        default: 'master'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (SSH + systemd)
    runs-on: ubuntu-latest
    # Requires a "production" Environment configured in repo Settings with
    # required reviewers — the job pauses here until someone approves it.
    environment: production
    steps:
      - name: Checkout selected deployment ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || 'master' }}

      # Deploy the resolved immutable SHA so a moving branch cannot change
      # the approved deployment target between checkout and the SSH step.
      - name: Resolve deployment commit
        id: ref
        run: echo "value=$(git rev-parse --verify 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            bash /var/www/aviqr/aviqr-backend/deploy/deploy.sh "${{ steps.ref.outputs.value }}"

      - name: Summary
        if: always()
        env:
          DEPLOY_SHA: ${{ steps.ref.outputs.value }}
        run: |
          echo "### Deploy target" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
