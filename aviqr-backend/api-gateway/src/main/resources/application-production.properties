# ─── Production API Gateway ───────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# CORS — production origins
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[5]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

app.jwt.secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health,info
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=https://aviqr.com,https://www.aviqr.com,https://app.aviqr.com,https://admin.aviqr.com

# Only private interfaces may expose services; public traffic enters through Nginx.
server.address=${SERVICE_BIND_ADDRESS:127.0.0.1}

app.service-signed-auth-required=${SERVICE_SIGNED_AUTH_REQUIRED:true}
eureka.instance.ip-address=${SERVICE_ADVERTISE_ADDRESS:127.0.0.1}

# Public API traffic must arrive over TLS via a trusted reverse proxy.
app.transport.require-https=true

# Stable key must be shared by blue/green gateway instances.
app.payload.require-encrypted=${PAYLOAD_ENCRYPTION_REQUIRED:true}
app.payload.require-provisioned-key=true
