# ─── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ───────────────────────────────────────────────────────────────
spring.application.name=api-gateway

# Explicitly reactive — prevents Eureka client from pulling in MVC / Tomcat
spring.main.web-application-type=reactive

# ─── Spring Cloud Gateway ──────────────────────────────────────────────────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# ─── CORS ──────────────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[2]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[3]=http://localhost:8081
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[4]=https://aviqr.com
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[5]=https://www.aviqr.com
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[6]=http://65.109.133.21:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[5]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ─── Routes ────────────────────────────────────────────────────────────────────

# Route 0: Auth public (no JWT needed)
spring.cloud.gateway.routes[0].id=auth-service-public
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/otp/send,/api/v1/auth/otp/login,/api/v1/auth/refresh,/api/v1/auth/forgot-password
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}

# Route 1: Auth protected
spring.cloud.gateway.routes[1].id=auth-service-protected
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/logout,/api/v1/auth/profile,/api/v1/auth/change-password,/api/v1/auth/language,/api/v1/auth/link-shop,/api/v1/auth/admin/**,/api/v1/auth/addresses/**,/api/v1/auth/deactivate
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# Route 2: Shop search/list (public) — GET /api/v1/shops only, so anonymous
# customers can search restaurants from the portal-home scan/search screen
# (aviqr-ui-web PortalHome.jsx / aviqr-mobile-expo portal-home.js) before they've
# scanned any QR or logged in. Must come before Route 36 (shop-service), which
# otherwise claims all of /api/v1/shops/** behind AuthenticationFilter — same
# same-prefix public/protected pairing as Route 18/19, 24/25, 26/27. The Method=GET
# predicate keeps POST /api/v1/shops (shop creation) falling through to Route 36
# and staying authenticated.
spring.cloud.gateway.routes[2].id=shop-service-search-public
spring.cloud.gateway.routes[2].uri=lb://shop-mall-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/shops
spring.cloud.gateway.routes[2].predicates[1]=Method=GET
spring.cloud.gateway.routes[2].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[0].args.redis-rate-limiter.replenishRate=60
spring.cloud.gateway.routes[2].filters[0].args.redis-rate-limiter.burstCapacity=100
spring.cloud.gateway.routes[2].filters[0].args.key-resolver=#{@ipKeyResolver}

# Route 22: Shop-service brands public directory (no auth — must come before Route 23)
spring.cloud.gateway.routes[22].id=shop-service-brands-public
spring.cloud.gateway.routes[22].uri=lb://shop-mall-service
spring.cloud.gateway.routes[22].predicates[0]=Path=/api/v1/brands/public/**

# Route 23: Shop-service brands (authenticated — manage/create own brand)
spring.cloud.gateway.routes[23].id=shop-service-brands
spring.cloud.gateway.routes[23].uri=lb://shop-mall-service
spring.cloud.gateway.routes[23].predicates[0]=Path=/api/v1/brands/**
spring.cloud.gateway.routes[23].filters[0]=AuthenticationFilter

# Route 3: Menu public
spring.cloud.gateway.routes[3].id=menu-service-public
spring.cloud.gateway.routes[3].uri=lb://menu-ocr-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/menu/public/**
spring.cloud.gateway.routes[3].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[3].filters[0].args.redis-rate-limiter.replenishRate=120
spring.cloud.gateway.routes[3].filters[0].args.redis-rate-limiter.burstCapacity=200
spring.cloud.gateway.routes[3].filters[0].args.key-resolver=#{@ipKeyResolver}

# Route 4: Menu protected + inventory
spring.cloud.gateway.routes[4].id=menu-service-protected
spring.cloud.gateway.routes[4].uri=lb://menu-ocr-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/menu/**,/api/v1/categories/**,/api/v1/items/**,/api/v1/pricing-rules/**,/api/v1/inventory/**,/api/v1/raw-materials/**,/api/v1/variants/**,/api/v1/addons/**,/api/v1/recipes/**,/api/v1/shortcodes/**,/api/v1/dining-areas/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

# Route 5: Aggregator webhooks (public — Zomato/Swiggy send requests with their own auth)
spring.cloud.gateway.routes[5].id=aggregator-public
spring.cloud.gateway.routes[5].uri=lb://order-qr-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/aggregator/zomato/webhook,/api/v1/aggregator/swiggy/webhook

# Route 6: Anonymous "track my order" lookup — no auth (must come before Route 37,
# the general /api/v1/orders/** route, since gateway routes are evaluated in index
# order and a lower index here is required to catch this narrower path first).
spring.cloud.gateway.routes[6].id=order-service-public-lookup
spring.cloud.gateway.routes[6].uri=lb://order-qr-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/orders/public/**
spring.cloud.gateway.routes[6].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[6].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.routes[6].filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.routes[6].filters[0].args.key-resolver=#{@ipKeyResolver}

# Route 7: Payment + Razorpay webhook (webhook is unauthenticated — Razorpay sends it)
spring.cloud.gateway.routes[7].id=payment-webhook
spring.cloud.gateway.routes[7].uri=lb://payment-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/payments/webhook/**

# Route 8: Payment (authenticated)
spring.cloud.gateway.routes[8].id=payment-service
spring.cloud.gateway.routes[8].uri=lb://payment-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.routes[8].filters[0]=AuthenticationFilter

# Route 9: QR public — image download and QR redirect (no auth needed for customers)
# QR generation merged into order-service.
spring.cloud.gateway.routes[9].id=qr-public
spring.cloud.gateway.routes[9].uri=lb://order-qr-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/qr-codes/*/image,/api/v1/qr-codes/r/**

# Route 10: QR (management — authenticated)
spring.cloud.gateway.routes[10].id=qr-service
spring.cloud.gateway.routes[10].uri=lb://order-qr-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/qr-codes/**
spring.cloud.gateway.routes[10].filters[0]=AuthenticationFilter

# Route 11: Notification
spring.cloud.gateway.routes[11].id=notification-service
spring.cloud.gateway.routes[11].uri=lb://notification-report-review-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[11].filters[0]=AuthenticationFilter

# Route 12: Hotel
spring.cloud.gateway.routes[12].id=hotel-service
spring.cloud.gateway.routes[12].uri=lb://hotel-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/v1/hotels/**,/api/v1/rooms/**,/api/v1/room-requests/**,/api/v1/hotel-outlets/**,/api/v1/hotel/**,/api/v1/owners/**
spring.cloud.gateway.routes[12].filters[0]=AuthenticationFilter

# Route 12b: Hotel public guest-facing (no auth)
spring.cloud.gateway.routes[21].id=hotel-public
spring.cloud.gateway.routes[21].uri=lb://hotel-service
spring.cloud.gateway.routes[21].predicates[0]=Path=/api/v1/public/hotel/**

# Route 13: Mall public vendor directory (no auth — must come before Route 14)
# Mall/vendor management merged into shop-service.
spring.cloud.gateway.routes[13].id=mall-public
spring.cloud.gateway.routes[13].uri=lb://shop-mall-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/v1/malls/public/**

# Route 14: Mall (authenticated)
spring.cloud.gateway.routes[14].id=mall-service
spring.cloud.gateway.routes[14].uri=lb://shop-mall-service
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/v1/malls/**,/api/v1/vendors/**
spring.cloud.gateway.routes[14].filters[0]=AuthenticationFilter

# Route 15: Support
spring.cloud.gateway.routes[15].id=support-service
spring.cloud.gateway.routes[15].uri=lb://support-service
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/v1/support/**,/api/v1/tickets/**,/api/v1/audit-logs/**
spring.cloud.gateway.routes[15].filters[0]=AuthenticationFilter

# Route 16: Report — merged into notification-service
spring.cloud.gateway.routes[16].id=report-service
spring.cloud.gateway.routes[16].uri=lb://notification-report-review-service
spring.cloud.gateway.routes[16].predicates[0]=Path=/api/v1/reports/**
spring.cloud.gateway.routes[16].filters[0]=AuthenticationFilter

# Route 17: OCR — merged into menu-service
spring.cloud.gateway.routes[17].id=ocr-service
spring.cloud.gateway.routes[17].uri=lb://menu-ocr-service
spring.cloud.gateway.routes[17].predicates[0]=Path=/api/v1/ocr/**
spring.cloud.gateway.routes[17].filters[0]=AuthenticationFilter

# Route 18: Review public (shop/product summaries, no auth needed)
spring.cloud.gateway.routes[18].id=review-service-public
spring.cloud.gateway.routes[18].uri=lb://notification-report-review-service
spring.cloud.gateway.routes[18].predicates[0]=Path=/api/v1/reviews/public/**

# Route 19: Review protected
spring.cloud.gateway.routes[19].id=review-service
spring.cloud.gateway.routes[19].uri=lb://notification-report-review-service
spring.cloud.gateway.routes[19].predicates[0]=Path=/api/v1/reviews/**
spring.cloud.gateway.routes[19].filters[0]=AuthenticationFilter

# Route 24: Shop-service plans public (pricing/signup pages — must come before Route 25)
spring.cloud.gateway.routes[24].id=shop-service-plans-public
spring.cloud.gateway.routes[24].uri=lb://shop-mall-service
spring.cloud.gateway.routes[24].predicates[0]=Path=/api/v1/plans/public/**

# Route 25: Shop-service plans (admin CRUD)
spring.cloud.gateway.routes[25].id=shop-service-plans
spring.cloud.gateway.routes[25].uri=lb://shop-mall-service
spring.cloud.gateway.routes[25].predicates[0]=Path=/api/v1/plans/**
spring.cloud.gateway.routes[25].filters[0]=AuthenticationFilter

# Route 26: Shop-service offers public (live discount offers — must come before Route 27)
spring.cloud.gateway.routes[26].id=shop-service-offers-public
spring.cloud.gateway.routes[26].uri=lb://shop-mall-service
spring.cloud.gateway.routes[26].predicates[0]=Path=/api/v1/offers/public/**

# Route 27: Shop-service offers (admin CRUD)
spring.cloud.gateway.routes[27].id=shop-service-offers
spring.cloud.gateway.routes[27].uri=lb://shop-mall-service
spring.cloud.gateway.routes[27].predicates[0]=Path=/api/v1/offers/**
spring.cloud.gateway.routes[27].filters[0]=AuthenticationFilter

# Route 28: Shop promotions public (poster/customer-facing — must come before Route 29)
spring.cloud.gateway.routes[28].id=shop-service-promotions-public
spring.cloud.gateway.routes[28].uri=lb://shop-mall-service
spring.cloud.gateway.routes[28].predicates[0]=Path=/api/v1/shop-promotions/public/**

# Route 29: Shop promotions (owner/admin/support CRUD)
spring.cloud.gateway.routes[29].id=shop-service-promotions
spring.cloud.gateway.routes[29].uri=lb://shop-mall-service
spring.cloud.gateway.routes[29].predicates[0]=Path=/api/v1/shop-promotions/**
spring.cloud.gateway.routes[29].filters[0]=AuthenticationFilter

# Route 30: Shop-service tax rule resolution (public — lets clients preview the applicable
# tax rate; must come before Route 31)
spring.cloud.gateway.routes[30].id=shop-service-tax-rules-resolve
spring.cloud.gateway.routes[30].uri=lb://shop-mall-service
spring.cloud.gateway.routes[30].predicates[0]=Path=/api/v1/tax-rules/resolve/**

# Route 31: Shop-service tax rules (owner/admin/support CRUD)
spring.cloud.gateway.routes[31].id=shop-service-tax-rules
spring.cloud.gateway.routes[31].uri=lb://shop-mall-service
spring.cloud.gateway.routes[31].predicates[0]=Path=/api/v1/tax-rules/**
spring.cloud.gateway.routes[31].filters[0]=AuthenticationFilter

# Route 32: Shop-service unified customer profile (CRM — birthday/anniversary/notes/labels)
spring.cloud.gateway.routes[32].id=shop-service-customers
spring.cloud.gateway.routes[32].uri=lb://shop-mall-service
spring.cloud.gateway.routes[32].predicates[0]=Path=/api/v1/customers/**
spring.cloud.gateway.routes[32].filters[0]=AuthenticationFilter

# Route 33: Shop-service SMS CRM campaigns
spring.cloud.gateway.routes[33].id=shop-service-campaigns
spring.cloud.gateway.routes[33].uri=lb://shop-mall-service
spring.cloud.gateway.routes[33].predicates[0]=Path=/api/v1/campaigns/**
spring.cloud.gateway.routes[33].filters[0]=AuthenticationFilter

# Route 20: AI proxy — forwards /api/v1/ai/messages → Anthropic with server-side API key
# StripPrefix=3 removes /api/v1/ai, PrefixPath=/v1 restores /v1, giving /v1/messages
spring.cloud.gateway.routes[20].id=ai-proxy
spring.cloud.gateway.routes[20].uri=https://api.anthropic.com
spring.cloud.gateway.routes[20].predicates[0]=Path=/api/v1/ai/**
spring.cloud.gateway.routes[20].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[20].filters[1]=StripPrefix=3
spring.cloud.gateway.routes[20].filters[2]=PrefixPath=/v1
spring.cloud.gateway.routes[20].filters[3]=AddRequestHeader=x-api-key,${ANTHROPIC_API_KEY:not-configured}
spring.cloud.gateway.routes[20].filters[4]=AddRequestHeader=anthropic-version,2023-06-01

# Route 34: OpenAI proxy — fallback AI provider, used client-side only when the
# Anthropic call fails. Forwards /api/v1/ai-openai/chat/completions → OpenAI with
# server-side API key. StripPrefix=3 removes /api/v1/ai-openai, PrefixPath=/v1
# restores /v1, giving /v1/chat/completions.
spring.cloud.gateway.routes[34].id=ai-openai-proxy
spring.cloud.gateway.routes[34].uri=https://api.openai.com
spring.cloud.gateway.routes[34].predicates[0]=Path=/api/v1/ai-openai/**
spring.cloud.gateway.routes[34].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[34].filters[1]=StripPrefix=3
spring.cloud.gateway.routes[34].filters[2]=PrefixPath=/v1
spring.cloud.gateway.routes[34].filters[3]=AddRequestHeader=Authorization,Bearer ${OPENAI_API_KEY:not-configured}

# Route 35: Nearby shops (public) — its own top-level path rather than nested
# under /api/v1/shops/** (that's gateway-routed with AuthenticationFilter at
# Route 2, and same-prefix public/protected pairs need careful ordering —
# see Route 18/19 for that pattern). A distinct prefix has no such ordering
# dependency, so it's safe to just append here.
spring.cloud.gateway.routes[35].id=nearby-shops-public
spring.cloud.gateway.routes[35].uri=lb://shop-mall-service
spring.cloud.gateway.routes[35].predicates[0]=Path=/api/v1/nearby-shops

# Route 36: Shop (protected) — everything else under /api/v1/shops/** (by id, /my,
# POST create, etc.) plus shop-groups/staff/settings/loyalty/favorites. Must come
# after Route 2, which carves the public GET /api/v1/shops search/list out ahead of it.
spring.cloud.gateway.routes[36].id=shop-service
spring.cloud.gateway.routes[36].uri=lb://shop-mall-service
spring.cloud.gateway.routes[36].predicates[0]=Path=/api/v1/shops/**,/api/v1/shop-groups/**,/api/v1/staff/**,/api/v1/settings/**,/api/v1/loyalty/**,/api/v1/favorites/**
spring.cloud.gateway.routes[36].filters[0]=AuthenticationFilter

# Route 37: Order + aggregator + table bills (authenticated) — was Route 6,
# renumbered to make room for the public lookup route above at index 6.
spring.cloud.gateway.routes[37].id=order-service
spring.cloud.gateway.routes[37].uri=lb://order-qr-service
spring.cloud.gateway.routes[37].predicates[0]=Path=/api/v1/orders/**,/api/v1/aggregator/**,/api/v1/bills/**
spring.cloud.gateway.routes[37].filters[0]=AuthenticationFilter

# Route 38: Media upload (menu item photos, shop logos) — S3-backed, lives in
# menu-ocr-service since it already handles multipart file uploads (OCR scans).
spring.cloud.gateway.routes[38].id=media-service
spring.cloud.gateway.routes[38].uri=lb://menu-ocr-service
spring.cloud.gateway.routes[38].predicates[0]=Path=/api/v1/media/**
spring.cloud.gateway.routes[38].filters[0]=AuthenticationFilter

# Route 39: Shops sitemap.xml — crawler traffic only, so a much lower rate
# limit than the other public routes is fine.
spring.cloud.gateway.routes[39].id=sitemap-public
spring.cloud.gateway.routes[39].uri=lb://shop-mall-service
spring.cloud.gateway.routes[39].predicates[0]=Path=/api/v1/sitemap/**
spring.cloud.gateway.routes[39].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[39].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.routes[39].filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.routes[39].filters[0].args.key-resolver=#{@ipKeyResolver}

# ─── Redis (rate limiter + session cache) ──────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:aviqr_redis_secret}
# Fast-fail Redis connect (don't block startup waiting for Redis for 30s)
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
# Rate limiter — deny requests when key resolver returns empty (e.g. unknown IP)
spring.cloud.gateway.filter.request-rate-limiter.deny-empty-key=false
spring.cloud.gateway.filter.request-rate-limiter.empty-key-status-code=200

# ─── Eureka Client ─────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ─── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_for_hs384_needs_48_chars_minimum_x}

# ─── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoints.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174
management.endpoints.web.cors.allowed-methods=GET,OPTIONS

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.cloud.gateway=INFO
logging.level.in.aviqr=INFO
