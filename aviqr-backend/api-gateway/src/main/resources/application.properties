# ─── Server ────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ────────────────────────────────────────────────────────────
spring.application.name=api-gateway

# ─── Spring Cloud Gateway ────────────────────────────────────────────────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# ─── CORS ────────────────────────────────────────────────────────────────────
# Explicit origins required when allow-credentials=true (browsers reject wildcard+credentials)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[2]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[3]=https://aviqr.in
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[4]=https://www.aviqr.in
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ─── Routes — Auth Service ───────────────────────────────────────────────────
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

# ─── Routes — Shop Service ───────────────────────────────────────────────────
spring.cloud.gateway.routes[1].id=shop-service
spring.cloud.gateway.routes[1].uri=lb://shop-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/shops/**,/api/v1/shop-groups/**,/api/v1/staff/**,/api/v1/settings/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# ─── Routes — Menu Service (public) ─────────────────────────────────────────
spring.cloud.gateway.routes[2].id=menu-service-public
spring.cloud.gateway.routes[2].uri=lb://menu-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/menu/public/**

# ─── Routes — Menu Service (protected) ──────────────────────────────────────
spring.cloud.gateway.routes[3].id=menu-service
spring.cloud.gateway.routes[3].uri=lb://menu-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/menu/**,/api/v1/categories/**,/api/v1/items/**,/api/v1/pricing-rules/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

# ─── Routes — Order Service ──────────────────────────────────────────────────
spring.cloud.gateway.routes[4].id=order-service
spring.cloud.gateway.routes[4].uri=lb://order-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

# ─── Routes — Payment Service ────────────────────────────────────────────────
spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/payments/**,/api/v1/webhooks/razorpay
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter

# ─── Routes — QR Service ─────────────────────────────────────────────────────
spring.cloud.gateway.routes[6].id=qr-service
spring.cloud.gateway.routes[6].uri=lb://qr-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/qr-codes/**
spring.cloud.gateway.routes[6].filters[0]=AuthenticationFilter

# ─── Routes — Notification Service ──────────────────────────────────────────
spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://notification-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[7].filters[0]=AuthenticationFilter

# ─── Routes — Hotel Service ──────────────────────────────────────────────────
spring.cloud.gateway.routes[8].id=hotel-service
spring.cloud.gateway.routes[8].uri=lb://hotel-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/hotels/**,/api/v1/rooms/**,/api/v1/room-requests/**
spring.cloud.gateway.routes[8].filters[0]=AuthenticationFilter

# ─── Routes — Mall Service ───────────────────────────────────────────────────
spring.cloud.gateway.routes[9].id=mall-service
spring.cloud.gateway.routes[9].uri=lb://mall-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/malls/**,/api/v1/vendors/**
spring.cloud.gateway.routes[9].filters[0]=AuthenticationFilter

# ─── Routes — Support Service ────────────────────────────────────────────────
spring.cloud.gateway.routes[10].id=support-service
spring.cloud.gateway.routes[10].uri=lb://support-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/support/**,/api/v1/tickets/**,/api/v1/audit-logs/**
spring.cloud.gateway.routes[10].filters[0]=AuthenticationFilter

# ─── Routes — Report Service ─────────────────────────────────────────────────
spring.cloud.gateway.routes[11].id=report-service
spring.cloud.gateway.routes[11].uri=lb://report-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/reports/**
spring.cloud.gateway.routes[11].filters[0]=AuthenticationFilter

# ─── Routes — OCR Service ────────────────────────────────────────────────────
spring.cloud.gateway.routes[12].id=ocr-service
spring.cloud.gateway.routes[12].uri=lb://ocr-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/v1/ocr/**
spring.cloud.gateway.routes[12].filters[0]=AuthenticationFilter

# ─── Redis (rate limiter) ────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:aviqr_redis_secret}

# ─── Eureka Client ───────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_min_32_chars_long}

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.org.springframework.cloud.gateway=INFO
logging.level.in.aviqr=INFO

# ─── Actuator ────────────────────────────────────────────────────────────────
# Expose health endpoint — UI uses /actuator/health to detect backend status
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
# Allow CORS on actuator too
management.endpoints.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174
management.endpoints.web.cors.allowed-methods=GET

# ─── Actuator (health check for OfflineBanner) ───────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoints.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
