# ─── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ───────────────────────────────────────────────────────────────
spring.application.name=api-gateway

# ─── Spring Cloud Gateway ──────────────────────────────────────────────────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# ─── CORS ──────────────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[2]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[3]=https://aviqr.in
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[4]=https://www.aviqr.in
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ─── Routes ────────────────────────────────────────────────────────────────────

# Route 0: Auth public (no JWT needed)
spring.cloud.gateway.routes[0].id=auth-service-public
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/otp/send,/api/v1/auth/otp/login,/api/v1/auth/refresh,/api/v1/auth/forgot-password
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}

# Route 1: Auth protected
spring.cloud.gateway.routes[1].id=auth-service-protected
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/logout,/api/v1/auth/profile,/api/v1/auth/change-password,/api/v1/auth/language,/api/v1/auth/admin/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# Route 2: Shop
spring.cloud.gateway.routes[2].id=shop-service
spring.cloud.gateway.routes[2].uri=lb://shop-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/shops/**,/api/v1/shop-groups/**,/api/v1/staff/**,/api/v1/settings/**,/api/v1/loyalty/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# Route 3: Menu public
spring.cloud.gateway.routes[3].id=menu-service-public
spring.cloud.gateway.routes[3].uri=lb://menu-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/menu/public/**
spring.cloud.gateway.routes[3].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[3].filters[0].args.redis-rate-limiter.replenishRate=120
spring.cloud.gateway.routes[3].filters[0].args.redis-rate-limiter.burstCapacity=200
spring.cloud.gateway.routes[3].filters[0].args.key-resolver=#{@ipKeyResolver}

# Route 4: Menu protected + inventory
spring.cloud.gateway.routes[4].id=menu-service-protected
spring.cloud.gateway.routes[4].uri=lb://menu-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/menu/**,/api/v1/categories/**,/api/v1/items/**,/api/v1/pricing-rules/**,/api/v1/inventory/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

# Route 5: Order
spring.cloud.gateway.routes[5].id=order-service
spring.cloud.gateway.routes[5].uri=lb://order-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/orders/**,/api/v1/aggregator/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter

# Route 6: Payment + Razorpay webhook (webhook is unauthenticated — Razorpay sends it)
spring.cloud.gateway.routes[6].id=payment-webhook
spring.cloud.gateway.routes[6].uri=lb://payment-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/payments/webhook/**

# Route 7: Payment (authenticated)
spring.cloud.gateway.routes[7].id=payment-service
spring.cloud.gateway.routes[7].uri=lb://payment-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.routes[7].filters[0]=AuthenticationFilter

# Route 8: QR (image download is public — customers need it without auth)
spring.cloud.gateway.routes[8].id=qr-image-public
spring.cloud.gateway.routes[8].uri=lb://qr-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/qr-codes/*/image

# Route 9: QR (management — authenticated)
spring.cloud.gateway.routes[9].id=qr-service
spring.cloud.gateway.routes[9].uri=lb://qr-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/qr-codes/**
spring.cloud.gateway.routes[9].filters[0]=AuthenticationFilter

# Route 10: Notification
spring.cloud.gateway.routes[10].id=notification-service
spring.cloud.gateway.routes[10].uri=lb://notification-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[10].filters[0]=AuthenticationFilter

# Route 11: Hotel
spring.cloud.gateway.routes[11].id=hotel-service
spring.cloud.gateway.routes[11].uri=lb://hotel-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/hotels/**,/api/v1/rooms/**,/api/v1/room-requests/**
spring.cloud.gateway.routes[11].filters[0]=AuthenticationFilter

# Route 12: Mall
spring.cloud.gateway.routes[12].id=mall-service
spring.cloud.gateway.routes[12].uri=lb://mall-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/v1/malls/**,/api/v1/vendors/**
spring.cloud.gateway.routes[12].filters[0]=AuthenticationFilter

# Route 13: Support
spring.cloud.gateway.routes[13].id=support-service
spring.cloud.gateway.routes[13].uri=lb://support-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/v1/support/**,/api/v1/tickets/**,/api/v1/audit-logs/**
spring.cloud.gateway.routes[13].filters[0]=AuthenticationFilter

# Route 14: Report
spring.cloud.gateway.routes[14].id=report-service
spring.cloud.gateway.routes[14].uri=lb://report-service
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/v1/reports/**
spring.cloud.gateway.routes[14].filters[0]=AuthenticationFilter

# Route 15: OCR
spring.cloud.gateway.routes[15].id=ocr-service
spring.cloud.gateway.routes[15].uri=lb://ocr-service
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/v1/ocr/**
spring.cloud.gateway.routes[15].filters[0]=AuthenticationFilter

# ─── Redis (rate limiter + session cache) ──────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:aviqr_redis_secret}

# ─── Eureka Client ─────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ─── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_min_32_chars_long}

# ─── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoints.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174
management.endpoints.web.cors.allowed-methods=GET,OPTIONS

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.cloud.gateway=INFO
logging.level.in.aviqr=INFO
