# ─── STAGING — override these via env vars or CI secrets ────────────

spring.data.mongodb.host=${MONGO_HOST:staging-mongo}
spring.data.mongodb.port=27017
spring.data.mongodb.database=aviqr_logs
spring.data.mongodb.username=${MONGO_USERNAME}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.authentication-database=admin

spring.rabbitmq.host=${RABBITMQ_HOST:staging-rabbit}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.data.redis.host=${REDIS_HOST:staging-redis}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://staging-registry:8761/eureka}

logging.level.in.aviqr=DEBUG
logging.level.org.springframework.security=WARN
# Public API traffic must arrive over TLS via a trusted reverse proxy.
app.transport.require-https=true

# Stable key must be shared by blue/green gateway instances.
app.payload.require-encrypted=${PAYLOAD_ENCRYPTION_REQUIRED:true}
app.payload.require-provisioned-key=true
