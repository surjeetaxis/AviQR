# ═══ notification-service — application.properties ═══════════════════════════════════
server.port=0
spring.application.name=notification-report-review-service

# ── PostgreSQL — primary datasource is JPA's, for the Review entity (merged from
# review-service, own aviqr_review DB, schema pre-created by aviqr_setup.sql) ──────────
# Dual env-var pattern: Docker passes SPRING_DATASOURCE_URL; local dev uses DB_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/aviqr_review}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:aviqr}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:aviqr_secret}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ── PostgreSQL — second datasource: reports read the same aviqr_order DB as
# order-qr-service, read-only, via plain JdbcTemplate (see ReportDataSourceConfig) ──────
report.datasource.url=${REPORT_DATASOURCE_URL:${REPORT_DB_URL:jdbc:postgresql://localhost:5432/aviqr_order}}
report.datasource.username=${REPORT_DATASOURCE_USERNAME:${DB_USERNAME:aviqr}}
report.datasource.password=${REPORT_DATASOURCE_PASSWORD:${DB_PASSWORD:aviqr_secret}}
report.datasource.driver-class-name=org.postgresql.Driver

# ── MongoDB ─────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://aviqr:aviqr_secret@localhost:27017/aviqr_logs?authSource=admin}

# ── RabbitMQ ────────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:aviqr}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aviqr_secret}

# ── Eureka Client ────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── JWT ──────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_for_hs384_needs_48_chars_minimum_x}

# ── Actuator (MUST be open — Eureka calls /actuator/health every 30s) ───────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ── Info ─────────────────────────────────────────────────────────────────────────
info.app.name=notification-report-review-service
info.app.version=1.0.0

# ── Logging ──────────────────────────────────────────────────────────────────────
logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN


# Email — via Elastic Email (https://elasticemail.com), not SMTP/Spring Mail
elasticemail.api.key=${ELASTIC_EMAIL_API_KEY:}
elasticemail.api.url=${ELASTIC_EMAIL_API_URL:https://api.elasticemail.com/v4/emails/transactional}
elasticemail.from=${ELASTIC_EMAIL_FROM:noreply@aviqr.com}
app.email.enabled=${APP_EMAIL_ENABLED:false}

twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.sms.from=${TWILIO_SMS_FROM:}
app.sms.enabled=${APP_SMS_ENABLED:false}

# WhatsApp — via WaSenderAPI (https://wasenderapi.com), not Twilio
wasender.api.key=${WASENDER_API_KEY:}
wasender.api.url=${WASENDER_API_URL:https://wasenderapi.com/api/send-message}
app.whatsapp.enabled=${APP_WHATSAPP_ENABLED:false}

# MSG91 — second SMS/WhatsApp/Email provider for OTP delivery, added alongside the above.
# Account-level AuthKey (not the OTP Widget's per-widget token) — requires phone-OTP 2FA to
# reveal from the MSG91 dashboard, so it must be supplied manually.
msg91.auth.key=${MSG91_AUTH_KEY:}
# SMS: needs a DLT-approved template ID (India regulatory requirement) before this can send —
# leave app.msg91.sms.enabled=false until msg91.sms.template-id is a real approved ID.
msg91.sms.template-id=${MSG91_SMS_TEMPLATE_ID:}
msg91.sms.otp-variable-name=${MSG91_SMS_OTP_VARIABLE_NAME:OTP}
app.msg91.sms.enabled=${APP_MSG91_SMS_ENABLED:false}
# WhatsApp: needs a WhatsApp Business number connected to the MSG91 account (Account > WhatsApp
# > Number > Add Number — real Meta Business verification) before this can send.
msg91.whatsapp.integrated-number=${MSG91_WHATSAPP_INTEGRATED_NUMBER:}
msg91.whatsapp.template-name=${MSG91_WHATSAPP_TEMPLATE_NAME:}
msg91.whatsapp.template-language=${MSG91_WHATSAPP_TEMPLATE_LANGUAGE:en}
app.msg91.whatsapp.enabled=${APP_MSG91_WHATSAPP_ENABLED:false}
# Email: aviqr.com is already verified as a sending domain and MSG91's pre-approved "global_otp"
# template needs no further setup — this one actually works once msg91.auth.key is set.
msg91.email.domain=${MSG91_EMAIL_DOMAIN:aviqr.com}
msg91.email.from-address=${MSG91_EMAIL_FROM_ADDRESS:noreply@aviqr.com}
msg91.email.from-name=${MSG91_EMAIL_FROM_NAME:AviQR}
msg91.email.otp-template-id=${MSG91_EMAIL_OTP_TEMPLATE_ID:global_otp}
app.msg91.email.enabled=${APP_MSG91_EMAIL_ENABLED:true}
