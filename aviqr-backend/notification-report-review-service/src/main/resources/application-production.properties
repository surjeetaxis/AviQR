# ─── PRODUCTION — all values via environment variables, no hardcoded secrets ──

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aviqr_review}
spring.datasource.username=${DB_USERNAME:aviqr}
spring.datasource.password=${DB_PASSWORD}

report.datasource.url=${REPORT_DB_URL:jdbc:postgresql://localhost:5432/aviqr_report}
report.datasource.username=${DB_USERNAME:aviqr}
report.datasource.password=${DB_PASSWORD}

spring.data.mongodb.host=${MONGO_HOST}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=aviqr_logs
spring.data.mongodb.username=${MONGO_USERNAME}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.authentication-database=admin

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN
logging.level.root=WARN