# ─── Server ───────────────────────────────────────────────
server.port=0

# ─── Application ──────────────────────────────────────────
spring.application.name=ocr-service

# ─── MongoDB (localhost) ───────────────────────────────
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=aviqr_logs
spring.data.mongodb.username=${MONGO_USERNAME:aviqr}
spring.data.mongodb.password=${MONGO_PASSWORD:aviqr_secret}
spring.data.mongodb.authentication-database=admin

# ─── RabbitMQ (localhost) ──────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:aviqr}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aviqr_secret}

# ─── File Upload ───────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ─── Eureka Client ─────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# ─── JWT ───────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_min_32_chars_long}

# ─── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ─── App Info ───────────────────────────────────────────────
info.app.name=ocr-service
info.app.version=1.0.0
info.app.description=AviQR microservice

# ─── Logging ────────────────────────────────────────────────
logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN