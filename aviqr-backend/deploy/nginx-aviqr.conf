# nginx-aviqr.conf — mirror of the live config at /etc/nginx/sites-available/aviqr
# on the production server (host "aviqr", 204.168.177.135). Not auto-deployed by
# any script — this is a reference copy so infra changes made by hand over SSH
# (like the aviqr_gateway upstream below) are recorded somewhere version-controlled
# instead of living only on the box. Keep it in sync by hand after any nginx change.
#
# aviqr_gateway is a 2-member upstream (127.0.0.1:8080 + :8081) backing the
# api-gateway blue/green zero-downtime deploy (see deploy.sh and
# aviqr-api-gateway.service / aviqr-api-gateway-alt.service): nginx's default
# proxy_next_upstream (error timeout) transparently retries a request against
# the other member if one port isn't accepting connections, so alternating
# which port is "active" during a deploy never surfaces a failed request to
# the client — max_fails/fail_timeout just make nginx stop trying the down
# one for a few seconds instead of retrying it on every single request.
upstream aviqr_gateway {
    server 127.0.0.1:8080 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=5s;
}

# ── Frontend — aviqr.com / www.aviqr.com ──────────────────────────────────
server {
    server_name aviqr.com www.aviqr.com;

    root /var/www/aviqr/aviqr-ui-web/dist;
    index index.html;

    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aviqr.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aviqr.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# ── API — api.aviqr.com → aviqr_gateway upstream (127.0.0.1:8080 + :8081) ──
server {
    server_name api.aviqr.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://aviqr_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aviqr.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aviqr.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.aviqr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aviqr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aviqr.com www.aviqr.com;
    return 404; # managed by Certbot




}
server {
    if ($host = api.aviqr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.aviqr.com;
    return 404; # managed by Certbot


}
