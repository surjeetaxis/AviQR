# /etc/nginx/sites-available/aviqr on the production server — pulled here
# verbatim so the actual live config is version-controlled instead of only
# existing as prose in DEPLOYMENT.md/DEPLOYMENT_NO_DOCKER.md, which drifted
# out of sync with what was really running more than once and cost a lot of
# back-and-forth to track down. This file is NOT auto-deployed by deploy.sh
# or any CI step — nginx config changes still have to be applied by hand
# (SSH in, edit, `nginx -t`, `systemctl reload nginx`) and then this file
# updated to match, in that order. Treat this as the source of truth for
# what SHOULD be live; if you're ever unsure whether it matches reality,
# `ssh aviqr "cat /etc/nginx/sites-available/aviqr"` and diff.
#
# The `# managed by Certbot` blocks are exactly that — Certbot rewrites
# those on cert renewal, so don't hand-edit inside them; if they ever drift
# from what's here, re-pull from the server rather than pushing this copy
# back over Certbot's version.

upstream aviqr_gateway {
    server 127.0.0.1:8080 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=5s;
}

# ── Frontend — aviqr.com / www.aviqr.com ──────────────────────────────────
server {
    server_name aviqr.com www.aviqr.com;

    root /var/www/aviqr/aviqr-ui-web/dist;
    index index.html;

    client_max_body_size 25M;

    location = /sitemap-shops.xml {
        proxy_pass http://aviqr_gateway/api/v1/sitemap/shops.xml;
        add_header Content-Type "application/xml";
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/index.html /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aviqr.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aviqr.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# ── API — api.aviqr.com → aviqr_gateway upstream (127.0.0.1:8080 + :8081) ──
server {
    server_name api.aviqr.com;

    client_max_body_size 25M;

    # A Search Console "Domain property" for aviqr.com covers every
    # subdomain, including this one - without this, Googlebot hits
    # api.aviqr.com/robots.txt, gets a 404 from the gateway (no static
    # files here, just a reverse proxy), and keeps re-trying it on every
    # crawl pass. Nothing here is worth indexing anyway (pure JSON API).
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://aviqr_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aviqr.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aviqr.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.aviqr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aviqr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aviqr.com www.aviqr.com;
    return 404; # managed by Certbot




}
server {
    if ($host = api.aviqr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.aviqr.com;
    return 404; # managed by Certbot


}