# /etc/nginx/sites-available/eureka on the production server (enabled via
# sites-enabled/eureka) — pulled here verbatim so it is version-controlled like
# aviqr.conf. Same rules apply: NOT auto-deployed; change it on the server
# (`nginx -t`, `systemctl reload nginx`) and then update this copy to match.
#
# Exposes the Eureka dashboard on eureka.aviqr.com behind HTTPS and HTTP basic
# auth. The password file (/etc/nginx/.htpasswd-eureka) stays on the server and
# is never committed. Eureka's own API (/eureka/**) is reachable here too, so keep
# the basic auth in place; services talk to Eureka directly on 127.0.0.1:8761.

server {
    server_name eureka.aviqr.com;

    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-eureka;

        proxy_pass http://127.0.0.1:8761;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eureka.aviqr.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eureka.aviqr.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = eureka.aviqr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name eureka.aviqr.com;
    return 404; # managed by Certbot


}