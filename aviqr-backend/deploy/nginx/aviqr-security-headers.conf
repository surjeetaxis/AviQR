# /etc/nginx/snippets/aviqr-security-headers.conf — included by the aviqr.com server
# block and by every location in it that sets its own add_header (nginx drops ALL
# server-level add_header lines in a location that declares any of its own).
#
# Applied by hand like the rest of the nginx config — see the header of aviqr.conf.

# includeSubDomains: every *.aviqr.com host must serve HTTPS (all live ones did on 2026-10-25:
# aviqr.com, www, api, bm). Give any new subdomain a certificate before it goes live.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The dashboard is only ever framed by itself (PMS document previews use blob: frames).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\"), usb=(), serial=(), bluetooth=()" always;

# Report-only first: violations show in the browser console without breaking anything.
# Watch the console on the menu, checkout (Razorpay), login (Turnstile), PMS and AI
# pages for a week, adjust, then rename the header to Content-Security-Policy.
#   script-src  GA, Razorpay checkout, Cloudflare Turnstile, model-viewer (ajax.googleapis.com)
#   style-src   'unsafe-inline' is required by React inline styles; Google Fonts CSS
#   img/media   menu photos and videos can be any https URL an owner pastes, plus S3 uploads
#   connect-src API, GA, Sentry, Razorpay; https: for model-viewer loading .glb from any URL
#   frame-src   YouTube/Vimeo menu videos, Razorpay, Turnstile, blob: PMS previews
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://checkout.razorpay.com https://challenges.cloudflare.com https://ajax.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss://api.aviqr.com; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://checkout.razorpay.com https://api.razorpay.com https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'self' blob:; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'self'; upgrade-insecure-requests" always;
