# /etc/nginx/snippets/aviqr-api-security-headers.conf — included by the api.aviqr.com
# server block. The API returns JSON and files, never pages, so its CSP allows nothing;
# the headers stop browsers sniffing a response into HTML or rendering it in a frame.
#
# Applied by hand like the rest of the nginx config — see the header of aviqr.conf.

# includeSubDomains: every *.aviqr.com host must serve HTTPS (all live ones did on 2026-10-25:
# aviqr.com, www, api, bm). Give any new subdomain a certificate before it goes live.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
