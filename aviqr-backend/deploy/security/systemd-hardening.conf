# Install as /etc/systemd/system/aviqr-<service>.service.d/security.conf.
# Repeat for both blue/green instances; service-specific environment file is required.
[Service]
EnvironmentFile=/etc/aviqr/services/%p.env
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=
AmbientCapabilities=
# Supply the narrow application write locations used by your installed service.
ReadWritePaths=/var/log/aviqr
