# ═══ notification-service — application.properties ═══════════════════════════════════
server.port=0
spring.application.name=notification-service

# ── MongoDB ─────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://aviqr:aviqr_secret@localhost:27017/aviqr_logs?authSource=admin}

# ── RabbitMQ ────────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:aviqr}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aviqr_secret}

# ── Eureka Client ────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── JWT ──────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_for_hs384_needs_48_chars_minimum_x}

# ── Actuator (MUST be open — Eureka calls /actuator/health every 30s) ───────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ── Info ─────────────────────────────────────────────────────────────────────────
info.app.name=notification-service
info.app.version=1.0.0

# ── Logging ──────────────────────────────────────────────────────────────────────
logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN


spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=${SMTP_HEALTH_ENABLED:false}
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
app.whatsapp.enabled=${APP_WHATSAPP_ENABLED:false}
