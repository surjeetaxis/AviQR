plugins { id 'org.springframework.boot' version '3.5.16' }

dependencies {
    testImplementation 'com.upokecenter:cbor:4.5.6'
    implementation project(':security-common')
    implementation 'com.yubico:webauthn-server-core:2.9.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.amqp:spring-rabbit'
    implementation 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
}

// Optional persistence regression tests must target a disposable PostgreSQL database.
tasks.named('test') {
    if (project.hasProperty('securityTestDbUrl')) {
        systemProperty 'aviqr.security.test-db', project.property('securityTestDbUrl')
    }
}
