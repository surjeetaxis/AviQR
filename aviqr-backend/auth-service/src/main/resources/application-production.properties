# ─── Production profile — all values from env vars ───────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aviqr_auth}
spring.datasource.username=${DB_USERNAME:aviqr}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.liquibase.enabled=${RUN_STARTUP_MIGRATIONS:false}

spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:aviqr_logs}
spring.data.mongodb.username=${MONGO_USERNAME:aviqr}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.authentication-database=admin

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

app.jwt.secret=${JWT_SECRET}

# OTP — hardcoded false (not env-overridable) so a missing env var can never
# accidentally leave the dev OTP bypass open in production
app.otp.dev-mode=false

# Connection pool — production sizing
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

logging.level.in.aviqr=WARN
logging.level.org.springframework=WARN

app.cookies.secure=true
app.browser.origins=https://aviqr.com,https://www.aviqr.com,https://app.aviqr.com,https://admin.aviqr.com

# Only private interfaces may expose services; public traffic enters through Nginx.
server.address=${SERVICE_BIND_ADDRESS:127.0.0.1}

app.captcha.enabled=${CAPTCHA_ENABLED:true}
app.passkeys.rp-id=${PASSKEY_RP_ID:aviqr.com}
app.passkeys.origins=${PASSKEY_ORIGINS:https://aviqr.com,https://www.aviqr.com,https://app.aviqr.com,https://admin.aviqr.com}

app.service-signed-auth-required=${SERVICE_SIGNED_AUTH_REQUIRED:true}
eureka.instance.ip-address=${SERVICE_ADVERTISE_ADDRESS:127.0.0.1}
