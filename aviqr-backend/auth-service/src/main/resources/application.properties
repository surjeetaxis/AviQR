# ═══ auth-service — application.properties ═══════════════════════════════════
server.port=0
spring.application.name=auth-service

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/aviqr_auth}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:aviqr}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:aviqr_secret}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.liquibase.enabled=false

# ── MongoDB ─────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://aviqr:aviqr_secret@localhost:27017/aviqr_logs?authSource=admin}

# ── Redis ────────────────────────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:aviqr_redis_secret}}

# ── RabbitMQ ────────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:aviqr}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aviqr_secret}

# ── Eureka Client ────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── JWT ──────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_for_hs384_needs_48_chars_minimum_x}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:72}
app.jwt.expiration-ms=259200000
app.jwt.refresh-expiration-ms=604800000

# ── OTP (dev: 123456 bypasses real OTP check) ────────────────────────────────────
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.dev-mode=${OTP_DEV_MODE:true}
app.otp.fixed-code=${OTP_FIXED_CODE:123456}

# ── Actuator ─────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ── Info ─────────────────────────────────────────────────────────────────────────
info.app.name=auth-service
info.app.version=1.0.0

# ── Logging ──────────────────────────────────────────────────────────────────────
logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
