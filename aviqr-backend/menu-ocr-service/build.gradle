plugins { id 'org.springframework.boot' version '3.3.0' }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.amqp:spring-rabbit'
    implementation 'org.postgresql:postgresql'
    implementation 'com.fasterxml.jackson.core:jackson-databind' // OCR text parsing (merged from ocr-service)
    // Real Vision API auth via GOOGLE_APPLICATION_CREDENTIALS service-account key (preferred
    // over the legacy GOOGLE_VISION_API_KEY REST+query-param path in OcrService.callGoogleVision).
    implementation 'com.google.cloud:google-cloud-vision:3.91.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'
}
