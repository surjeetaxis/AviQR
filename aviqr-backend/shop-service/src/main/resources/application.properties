# ─── Server ───────────────────────────────────────────────
server.port=0

# ─── Application ──────────────────────────────────────────
spring.application.name=shop-service

# ─── PostgreSQL (localhost) ────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aviqr_shop}
spring.datasource.username=${DB_USERNAME:aviqr}
spring.datasource.password=${DB_PASSWORD:aviqr_secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ─── JPA ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Liquibase ─────────────────────────────────────────
spring.liquibase.enabled=false

# ─── MongoDB (localhost) ───────────────────────────────
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=aviqr_logs
spring.data.mongodb.username=${MONGO_USERNAME:aviqr}
spring.data.mongodb.password=${MONGO_PASSWORD:aviqr_secret}
spring.data.mongodb.authentication-database=admin

# ─── RabbitMQ (localhost) ──────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:aviqr}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aviqr_secret}

# ─── Eureka Client ─────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# ─── JWT ───────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_min_32_chars_long}

# ─── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ─── App Info ───────────────────────────────────────────────
info.app.name=shop-service
info.app.version=1.0.0
info.app.description=AviQR microservice

# ─── Logging ────────────────────────────────────────────────
logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN