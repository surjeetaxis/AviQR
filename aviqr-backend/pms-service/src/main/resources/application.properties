# ═══ pms-service — application.properties ═══════════════════════════════════
server.port=0
app.base-url=${APP_BASE_URL:https://aviqr.com}
spring.application.name=pms-service

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
# Dual env-var pattern: Docker passes SPRING_DATASOURCE_URL; local dev uses DB_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/aviqr_pms}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:aviqr}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:aviqr_secret}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.liquibase.enabled=false

# ── RabbitMQ ────────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:aviqr}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aviqr_secret}

# ── Eureka Client ────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── JWT ──────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_for_hs384_needs_48_chars_minimum_x}

# ── Downstream services ────────────────────────────────────────────────────────────
hotel.service.url=${HOTEL_SERVICE_URL:http://hotel-service}
auth.service.url=${AUTH_SERVICE_URL:http://auth-service}
internal.sync.secret=${INTERNAL_SYNC_SECRET:}

# ── Channel manager ARI sync ──────────────────────────────────────────────────────
channel.sync.job.enabled=${CHANNEL_SYNC_JOB_ENABLED:true}
channel.sync.cron=${CHANNEL_SYNC_CRON:0 0 */6 * * *}

# ── Actuator (MUST be open — Eureka calls /actuator/health every 30s) ───────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ── Info ─────────────────────────────────────────────────────────────────────────
info.app.name=pms-service
info.app.version=1.0.0

# ── Logging ──────────────────────────────────────────────────────────────────────
logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
