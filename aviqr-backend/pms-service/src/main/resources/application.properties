# ═══ pms-service — application.properties ═══════════════════════════════════
server.port=0
app.base-url=${APP_BASE_URL:https://aviqr.com}
spring.application.name=pms-service

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
# Dual env-var pattern: Docker passes SPRING_DATASOURCE_URL; local dev uses DB_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/aviqr_pms}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:aviqr}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:aviqr_secret}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.liquibase.enabled=false

# ── RabbitMQ ────────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:aviqr}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aviqr_secret}

# ── Eureka Client ────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── JWT ──────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}

# ── Downstream services ────────────────────────────────────────────────────────────
hotel.service.url=${HOTEL_SERVICE_URL:http://hotel-service}
auth.service.url=${AUTH_SERVICE_URL:http://auth-service}
internal.sync.secret=${INTERNAL_SYNC_SECRET:}
payment.gateway.service.url=${PAYMENT_GATEWAY_SERVICE_URL:http://payment-gateway-service}
# Booking assistant (website chat + WhatsApp). Off without an API key.
anthropic.api-key=${ANTHROPIC_API_KEY:}
# AviQR's Meta app: webhook URL /api/v1/pms/public/whatsapp/webhook, verify token and app secret from the app dashboard.
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
whatsapp.graph-url=${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v23.0}

# ── MongoDB — channel sync logs ───────────────────────────────────────────────────
# Production's shared .env sets SPRING_DATA_MONGODB_URI (…/aviqr_logs?authSource=admin).
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/aviqr_logs}
spring.data.mongodb.uuid-representation=standard
# Logs older than this are removed by a MongoDB TTL index.
channel.sync-log.ttl-days=${CHANNEL_SYNC_LOG_TTL_DAYS:180}
# One-time copy of the old Postgres pms_channel_sync_logs rows into MongoDB.
channel.sync-log.migrate-from-postgres=${CHANNEL_SYNC_LOG_MIGRATE:true}

# ── Channel manager ARI sync ──────────────────────────────────────────────────────
channel.sync.job.enabled=${CHANNEL_SYNC_JOB_ENABLED:true}
channel.sync.cron=${CHANNEL_SYNC_CRON:0 0 */6 * * *}

# ── Actuator (MUST be open — Eureka calls /actuator/health every 30s) ───────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ── Info ─────────────────────────────────────────────────────────────────────────
info.app.name=pms-service
info.app.version=1.0.0

# ── Logging ──────────────────────────────────────────────────────────────────────
logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
