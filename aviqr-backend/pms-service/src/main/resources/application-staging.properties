# ─── STAGING — override these via env vars or CI secrets ────────────

spring.datasource.url=${DB_URL:jdbc:postgresql://staging-db:5432/aviqr_pms}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.rabbitmq.host=${RABBITMQ_HOST:staging-rabbit}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://staging-registry:8761/eureka}

logging.level.in.aviqr=DEBUG
logging.level.org.springframework.security=WARN
