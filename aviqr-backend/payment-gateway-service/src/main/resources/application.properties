# ═══ payment-gateway-service — application.properties ════════════════════════════
server.port=0
spring.application.name=payment-gateway-service

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/aviqr_payment_gateway}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:aviqr}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:aviqr_secret}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── Eureka Client ────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

internal.sync.secret=${INTERNAL_SYNC_SECRET:}
hotel.service.url=${HOTEL_SERVICE_URL:http://hotel-service}

# Hotels' gateway credentials are AES-256-GCM encrypted with this key (32 random bytes,
# base64). Generate with: openssl rand -base64 32. Losing it means re-entering every
# hotel's credentials, so back it up with the other service secrets.
payment-gateway.credential-key=${PAYMENT_GATEWAY_CREDENTIAL_KEY:}
# Public origin the guest's browser and the gateways reach this service through.
payment-gateway.public-base-url=${PAYMENT_GATEWAY_PUBLIC_URL:https://api.aviqr.com}
# Optional PayPal partner attribution (BN code) sent on PayPal API calls.
payment-gateway.paypal.partner-attribution-id=${PAYPAL_PARTNER_ATTRIBUTION_ID:}

logging.level.in.aviqr=INFO
