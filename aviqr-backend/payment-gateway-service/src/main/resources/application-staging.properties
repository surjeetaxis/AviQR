# ─── Production profile — all values from env vars ───────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aviqr_payment_gateway}
spring.datasource.username=${DB_USERNAME:aviqr}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000

logging.level.in.aviqr=WARN
logging.level.org.springframework=WARN

# Only private interfaces may expose services; public traffic enters through Nginx.
server.address=${SERVICE_BIND_ADDRESS:127.0.0.1}

app.service-signed-auth-required=${SERVICE_SIGNED_AUTH_REQUIRED:true}
eureka.instance.ip-address=${SERVICE_ADVERTISE_ADDRESS:127.0.0.1}
