version: '3.9'

# ── Common environment variables shared by all microservices ──────────────────
x-common-env: &common-env
  EUREKA_SERVER_URL: http://service-registry:8761/eureka
  JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long_please_change}
  SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: aviqr
  RABBITMQ_PASSWORD: aviqr_secret

x-postgres-env: &postgres-env
  SPRING_DATASOURCE_USERNAME: aviqr
  SPRING_DATASOURCE_PASSWORD: aviqr_secret

x-service-depends: &service-depends
  depends_on:
    service-registry:
      condition: service_healthy
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: aviqr-postgres
    environment:
      POSTGRES_USER: aviqr
      POSTGRES_PASSWORD: aviqr_secret
      POSTGRES_DB: aviqr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviqr"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - aviqr-net

  mongo:
    image: mongo:7.0
    container_name: aviqr-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: aviqr
      MONGO_INITDB_ROOT_PASSWORD: aviqr_secret
      MONGO_INITDB_DATABASE: aviqr_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - aviqr-net

  redis:
    image: redis:7-alpine
    container_name: aviqr-redis
    command: redis-server --requirepass aviqr_redis_secret
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "aviqr_redis_secret", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aviqr-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aviqr-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: aviqr
      RABBITMQ_DEFAULT_PASS: aviqr_secret
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aviqr-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Service Registry (Eureka) — must start first
  # ─────────────────────────────────────────────────────────────────────────────

  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    container_name: aviqr-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aviqr-net

  # ─────────────────────────────────────────────────────────────────────────────
  # API Gateway — starts after service-registry + redis
  # ─────────────────────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: aviqr-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long_please_change}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: aviqr_redis_secret
      REDIS_HOST: redis
      REDIS_PASSWORD: aviqr_redis_secret
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      service-registry:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aviqr-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Microservices
  # ─────────────────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: aviqr-auth
    environment:
      <<: [*common-env, *postgres-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_auth
    depends_on:
      service-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - aviqr-net

  # shop-mall-service also serves mall + vendor management (merged from mall-service)
  shop-mall-service:
    build:
      context: .
      dockerfile: shop-mall-service/Dockerfile
    container_name: aviqr-shop-mall
    environment:
      <<: [*common-env, *postgres-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_shop
      QR_SERVICE_URL: http://order-qr-service
    <<: *service-depends
    networks:
      - aviqr-net

  # menu-ocr-service also serves OCR menu import (merged from ocr-service)
  menu-ocr-service:
    build:
      context: .
      dockerfile: menu-ocr-service/Dockerfile
    container_name: aviqr-menu-ocr
    environment:
      <<: [*common-env, *postgres-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_menu
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
    <<: *service-depends
    networks:
      - aviqr-net

  # order-qr-service also serves QR generation/redirect + scan tracking (merged from qr-service)
  order-qr-service:
    build:
      context: .
      dockerfile: order-qr-service/Dockerfile
    container_name: aviqr-order-qr
    environment:
      <<: [*common-env, *postgres-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_order
      SHOP_SERVICE_URL: http://shop-mall-service
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    <<: *service-depends
    networks:
      - aviqr-net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: aviqr-payment
    environment:
      <<: [*common-env, *postgres-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_payment
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
    <<: *service-depends
    networks:
      - aviqr-net

  # notification-report-review-service also serves reports/analytics (merged from
  # report-service) and product/shop reviews (merged from review-service).
  # spring.datasource -> aviqr_review (JPA, Review entity); report.datasource ->
  # aviqr_order (JdbcTemplate, read-only, same DB as order-qr-service).
  notification-report-review-service:
    build:
      context: .
      dockerfile: notification-report-review-service/Dockerfile
    container_name: aviqr-notification-report-review
    environment:
      <<: [*common-env, *postgres-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_review
      REPORT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_order
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      APP_WHATSAPP_ENABLED: ${APP_WHATSAPP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    <<: *service-depends
    networks:
      - aviqr-net

  hotel-service:
    build:
      context: .
      dockerfile: hotel-service/Dockerfile
    container_name: aviqr-hotel
    environment:
      <<: [*common-env, *postgres-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_hotel
    <<: *service-depends
    networks:
      - aviqr-net

  support-service:
    build:
      context: .
      dockerfile: support-service/Dockerfile
    container_name: aviqr-support
    environment:
      <<: [*common-env, *postgres-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_support
    <<: *service-depends
    networks:
      - aviqr-net

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:

networks:
  aviqr-net:
    driver: bridge
