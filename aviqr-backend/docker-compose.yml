version: '3.9'

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: aviqr-postgres
    environment:
      POSTGRES_USER: aviqr
      POSTGRES_PASSWORD: aviqr_secret
      POSTGRES_DB: aviqr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviqr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aviqr-network

  mongo:
    image: mongo:8.0
    container_name: aviqr-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: aviqr
      MONGO_INITDB_ROOT_PASSWORD: aviqr_secret
      MONGO_INITDB_DATABASE: aviqr_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aviqr-network

  redis:
    image: redis:7.4-alpine
    container_name: aviqr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass aviqr_redis_secret
    networks:
      - aviqr-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aviqr-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: aviqr
      RABBITMQ_DEFAULT_PASS: aviqr_secret
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    networks:
      - aviqr-network

  # ── Service Registry (Eureka) ───────────────────────────────────────────────

  service-registry:
    build: ./service-registry
    container_name: aviqr-registry
    ports:
      - "8761:8761"
    networks:
      - aviqr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── API Gateway ─────────────────────────────────────────────────────────────

  api-gateway:
    build: ./api-gateway
    container_name: aviqr-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: aviqr_redis_secret
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  # ── Microservices ──────────────────────────────────────────────────────────

  auth-service:
    build: ./auth-service
    container_name: aviqr-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_auth
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: aviqr_redis_secret
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
      RABBITMQ_HOST: rabbitmq
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  shop-service:
    build: ./shop-service
    container_name: aviqr-shop
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_shop
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  menu-service:
    build: ./menu-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_menu
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  order-service:
    build: ./order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_order
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: aviqr_redis_secret
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
      RABBITMQ_HOST: rabbitmq
    deploy:
      replicas: 3
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  payment-service:
    build: ./payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_payment
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_secret}
      RABBITMQ_HOST: rabbitmq
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  qr-service:
    build: ./qr-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_qr
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
      APP_BASE_URL: ${APP_BASE_URL:-https://aviqr.in}
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  notification-service:
    build: ./notification-service
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      RABBITMQ_HOST: rabbitmq
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
    depends_on:
      mongo:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  hotel-service:
    build: ./hotel-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_hotel
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
      RABBITMQ_HOST: rabbitmq
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  mall-service:
    build: ./mall-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_mall
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  support-service:
    build: ./support-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr_support
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  report-service:
    build: ./report-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aviqr
      SPRING_DATASOURCE_USERNAME: aviqr
      SPRING_DATASOURCE_PASSWORD: aviqr_secret
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

  ocr-service:
    build: ./ocr-service
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://aviqr:aviqr_secret@mongo:27017/aviqr_logs?authSource=admin
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aviqr_super_secret_key_min_32_chars_long}
      RABBITMQ_HOST: rabbitmq
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
    depends_on:
      mongo:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - aviqr-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  aviqr-network:
    driver: bridge
