# ─── Server ───────────────────────────────────────────────
server.port=0

# ─── Application ──────────────────────────────────────────
spring.application.name=review-service

# ─── PostgreSQL (localhost) ────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aviqr_review}
spring.datasource.username=${DB_USERNAME:aviqr}
spring.datasource.password=${DB_PASSWORD:aviqr_secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ─── JPA ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Liquibase ─────────────────────────────────────────
spring.liquibase.enabled=false

# ─── Eureka Client ─────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# ─── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ─── App Info ───────────────────────────────────────────────
info.app.name=review-service
info.app.version=1.0.0
info.app.description=AviQR microservice

# ─── Logging ────────────────────────────────────────────────
logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN
