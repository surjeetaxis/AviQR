# ─── Server ────────────────────────────────────────────────────────────────
server.port=8761

# Disable the default Spring Whitelabel error page — our /error mapping handles it
server.error.whitelabel.enabled=false

# ─── Application ────────────────────────────────────────────────────────────
spring.application.name=service-registry

# ─── Disable Spring Security auto-config login page ──────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ─── Thymeleaf ───────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ─── Eureka Server ───────────────────────────────────────────────────────────
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${EUREKA_HOSTNAME:localhost}:8761/eureka/
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
logging.level.in.aviqr=INFO
