# ═══ support-service — application.properties ═══════════════════════════════════
server.port=0
spring.application.name=support-service

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
# Dual env-var pattern: Docker passes SPRING_DATASOURCE_URL; local dev uses DB_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/aviqr_support}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:aviqr}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:aviqr_secret}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# See auth-service's application.properties for why Liquibase and ddl-auto=update
# coexist here: ddl-auto keeps managing pre-existing tables, Liquibase carries the
# new incremental changesets (impersonation_logs.session_id) production-safely.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── MongoDB ─────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://aviqr:aviqr_secret@localhost:27017/aviqr_logs?authSource=admin}

# ── Eureka Client ────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── JWT ──────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aviqr_super_secret_key_for_hs384_needs_48_chars_minimum_x}

# ── Internal trust secret (sent as X-Internal-Secret on calls to auth-service) ──────
internal.sync.secret=${INTERNAL_SYNC_SECRET:}

# ── Analytics: read-only cross-service datasources (auth-service + order-qr-service DBs) ──
analytics.auth-datasource.url=${ANALYTICS_AUTH_DB_URL:jdbc:postgresql://localhost:5432/aviqr_auth}
analytics.auth-datasource.username=${ANALYTICS_AUTH_DB_USERNAME:${DB_USERNAME:aviqr}}
analytics.auth-datasource.password=${ANALYTICS_AUTH_DB_PASSWORD:${DB_PASSWORD:aviqr_secret}}
analytics.auth-datasource.driver-class-name=org.postgresql.Driver

analytics.order-datasource.url=${ANALYTICS_ORDER_DB_URL:jdbc:postgresql://localhost:5432/aviqr_order}
analytics.order-datasource.username=${ANALYTICS_ORDER_DB_USERNAME:${DB_USERNAME:aviqr}}
analytics.order-datasource.password=${ANALYTICS_ORDER_DB_PASSWORD:${DB_PASSWORD:aviqr_secret}}
analytics.order-datasource.driver-class-name=org.postgresql.Driver

# ── Actuator (MUST be open — Eureka calls /actuator/health every 30s) ───────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ── Info ─────────────────────────────────────────────────────────────────────────
info.app.name=support-service
info.app.version=1.0.0

# ── Logging ──────────────────────────────────────────────────────────────────────
logging.level.in.aviqr=INFO
logging.level.org.springframework.security=WARN
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
