<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #0F6E56; } a:hover { color: #085041; }
  </style>
</helmet>
<div style="width:1080px;height:1080px;position:relative;overflow:hidden;background:#FAFAFA;box-sizing:border-box;">
  <div style="display:flex;flex-direction:column;height:100%;padding:72px;box-sizing:border-box;">

    <!-- wordmark -->
    <div style="display:flex;align-items:center;gap:12px;">
      <svg viewBox="0 0 28 28" width="36" height="36" fill="none">
        <rect x="3" y="3" width="9" height="9" rx="2" fill="#1D9E75"/>
        <rect x="16" y="3" width="9" height="9" rx="2" fill="#0A0A0A" opacity="0.9"/>
        <rect x="3" y="16" width="9" height="9" rx="2" fill="#0A0A0A" opacity="0.9"/>
        <rect x="5.5" y="5.5" width="4" height="4" rx="1" fill="#fff"/>
        <rect x="18.5" y="5.5" width="4" height="4" rx="1" fill="#fff"/>
        <rect x="5.5" y="18.5" width="4" height="4" rx="1" fill="#fff"/>
        <rect x="16" y="16" width="4" height="4" rx="1" fill="#1D9E75"/>
        <rect x="21" y="16" width="4" height="4" rx="1" fill="#1D9E75"/>
        <rect x="16" y="21" width="4" height="4" rx="1" fill="#1D9E75"/>
        <rect x="21" y="21" width="4" height="4" rx="1" fill="#5DCAA5"/>
      </svg>
      <div style="font-size:24px;font-weight:800;letter-spacing:-0.02em;color:#111111;">Avi<span style="color:#1D9E75;">QR</span></div>
    </div>

    <!-- eyebrow -->
    <div style="margin-top:44px;display:inline-flex;align-self:flex-start;background:#E1F5EE;border:1.5px solid #1D9E75;border-radius:999px;padding:8px 18px;">
      <span style="font-size:15px;font-weight:700;color:#0F6E56;letter-spacing:0.02em;text-transform:uppercase;">Free tool · No signup</span>
    </div>

    <!-- headline -->
    <div style="margin-top:24px;font-size:60px;font-weight:900;line-height:1.08;letter-spacing:-0.02em;color:#111111;max-width:820px;">
      Turn any menu link into a QR code.
    </div>
    <div style="margin-top:16px;font-size:24px;font-weight:500;color:#4A4A4A;max-width:640px;">
      Paste a link — a PDF, Google Drive file, or website. Get a downloadable QR code in seconds.
    </div>

    <!-- tool mockup card -->
    <div style="margin-top:48px;flex:1;display:flex;align-items:center;justify-content:center;">
      <div style="width:100%;max-width:820px;background:#ffffff;border:1px solid #E5E7EB;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,0.08);padding:40px;display:flex;gap:36px;align-items:center;">
        <div style="flex:1;display:flex;flex-direction:column;gap:18px;">
          <div>
            <div style="font-size:14px;font-weight:700;color:#2D2D2D;margin-bottom:8px;">Menu link</div>
            <div style="height:52px;border:1.5px solid #E5E7EB;border-radius:12px;display:flex;align-items:center;padding:0 18px;font-size:17px;color:#9CA3AF;">https://drive.google.com/...</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;background:#1D9E75;border-radius:999px;padding:14px 26px;align-self:flex-start;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v14M6 11l6 6 6-6M5 21h14"/></svg>
            <span style="font-size:16px;font-weight:700;color:#ffffff;">Download PNG</span>
          </div>
        </div>
        <div style="width:200px;height:200px;background:#FAFAFA;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg viewBox="0 0 28 28" width="120" height="120" fill="none">
            <rect x="3" y="3" width="9" height="9" rx="1.4" fill="#111111"/>
            <rect x="16" y="3" width="9" height="9" rx="1.4" fill="#111111"/>
            <rect x="3" y="16" width="9" height="9" rx="1.4" fill="#111111"/>
            <rect x="5.5" y="5.5" width="4" height="4" rx="0.6" fill="#fff"/>
            <rect x="18.5" y="5.5" width="4" height="4" rx="0.6" fill="#fff"/>
            <rect x="5.5" y="18.5" width="4" height="4" rx="0.6" fill="#fff"/>
            <rect x="16" y="16" width="4" height="4" rx="0.6" fill="#1D9E75"/>
            <rect x="21" y="16" width="4" height="4" rx="0.6" fill="#111111"/>
            <rect x="16" y="21" width="4" height="4" rx="0.6" fill="#111111"/>
            <rect x="21" y="21" width="4" height="4" rx="0.6" fill="#1D9E75"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <div style="text-align:center;">
      <span style="font-size:24px;font-weight:800;color:#0F6E56;letter-spacing:-0.01em;">aviqr.com/free-qr-menu-generator</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
