<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #0F6E56; } a:hover { color: #085041; }
  </style>
</helmet>
<div style="width:1080px;height:1080px;position:relative;overflow:hidden;background:#FAFAFA;box-sizing:border-box;">
  <div style="display:flex;flex-direction:column;height:100%;padding:72px;box-sizing:border-box;">

    <!-- wordmark -->
    <div style="display:flex;align-items:center;gap:12px;">
      <svg viewBox="0 0 28 28" width="36" height="36" fill="none">
        <rect x="3" y="3" width="9" height="9" rx="2" fill="#1D9E75"/>
        <rect x="16" y="3" width="9" height="9" rx="2" fill="#0A0A0A" opacity="0.9"/>
        <rect x="3" y="16" width="9" height="9" rx="2" fill="#0A0A0A" opacity="0.9"/>
        <rect x="5.5" y="5.5" width="4" height="4" rx="1" fill="#fff"/>
        <rect x="18.5" y="5.5" width="4" height="4" rx="1" fill="#fff"/>
        <rect x="5.5" y="18.5" width="4" height="4" rx="1" fill="#fff"/>
        <rect x="16" y="16" width="4" height="4" rx="1" fill="#1D9E75"/>
        <rect x="21" y="16" width="4" height="4" rx="1" fill="#1D9E75"/>
        <rect x="16" y="21" width="4" height="4" rx="1" fill="#1D9E75"/>
        <rect x="21" y="21" width="4" height="4" rx="1" fill="#5DCAA5"/>
      </svg>
      <div style="font-size:24px;font-weight:800;letter-spacing:-0.02em;color:#111111;">Avi<span style="color:#1D9E75;">QR</span></div>
    </div>

    <!-- eyebrow -->
    <div style="margin-top:44px;display:inline-flex;align-self:flex-start;background:#E1F5EE;border:1.5px solid #1D9E75;border-radius:999px;padding:8px 18px;">
      <span style="font-size:15px;font-weight:700;color:#0F6E56;letter-spacing:0.02em;text-transform:uppercase;">Refer &amp; earn</span>
    </div>

    <!-- headline -->
    <div style="margin-top:24px;font-size:56px;font-weight:900;line-height:1.1;letter-spacing:-0.02em;color:#111111;max-width:820px;">
      Know a restaurant that needs this?
    </div>
    <div style="margin-top:16px;font-size:24px;font-weight:500;color:#4A4A4A;max-width:640px;">
      Share your code — when they sign up, you both get a free 30-day trial extension.
    </div>

    <!-- referral code card, mirroring the app's own referralCodeBox styling -->
    <div style="flex:1;display:flex;align-items:center;justify-content:center;">
      <div style="width:100%;max-width:640px;background:#E1F5EE;border:2px solid #1D9E75;border-radius:24px;padding:48px;text-align:center;">
        <div style="font-size:15px;font-weight:700;color:#4A4A4A;text-transform:uppercase;letter-spacing:0.08em;">Your referral code</div>
        <div style="margin-top:14px;font-size:72px;font-weight:900;color:#0F6E56;letter-spacing:0.12em;">AB12CD</div>
        <div style="margin-top:20px;display:inline-flex;align-items:center;gap:10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5 15.4 6.5M8.6 13.5 15.4 17.5"/></svg>
          <span style="font-size:17px;font-weight:700;color:#0F6E56;">Share your link</span>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <div style="text-align:center;">
      <span style="font-size:24px;font-weight:800;color:#0F6E56;letter-spacing:-0.01em;">aviqr.com/register</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
