<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #ffffff; } a:hover { color: #E1F5EE; }
  </style>
</helmet>
<div style="width:1080px;height:1080px;position:relative;overflow:hidden;background:linear-gradient(135deg, #1D9E75 0%, #0F6E56 55%, #085041 100%);">

  <!-- decorative QR watermark, bottom-right, matching LogoMark.jsx's exact finder-square recipe scaled up -->
  <div style="position:absolute;right:-90px;bottom:-90px;width:640px;height:640px;opacity:0.14;">
    <svg viewBox="0 0 28 28" width="640" height="640" fill="none">
      <rect x="3" y="3" width="9" height="9" rx="1.8" fill="#ffffff"/>
      <rect x="16" y="3" width="9" height="9" rx="1.8" fill="#ffffff"/>
      <rect x="3" y="16" width="9" height="9" rx="1.8" fill="#ffffff"/>
      <rect x="5.5" y="5.5" width="4" height="4" rx="0.8" fill="#0F6E56"/>
      <rect x="18.5" y="5.5" width="4" height="4" rx="0.8" fill="#0F6E56"/>
      <rect x="5.5" y="18.5" width="4" height="4" rx="0.8" fill="#0F6E56"/>
      <rect x="16" y="16" width="4" height="4" rx="0.8" fill="#ffffff"/>
      <rect x="21" y="16" width="4" height="4" rx="0.8" fill="#ffffff"/>
      <rect x="16" y="21" width="4" height="4" rx="0.8" fill="#ffffff"/>
      <rect x="21" y="21" width="4" height="4" rx="0.8" fill="#ffffff"/>
    </svg>
  </div>

  <div style="position:relative;display:flex;flex-direction:column;height:100%;padding:72px;box-sizing:border-box;">

    <!-- wordmark, matching LogoMark.jsx + land-wordmark treatment -->
    <div style="display:flex;align-items:center;gap:12px;">
      <svg viewBox="0 0 28 28" width="40" height="40" fill="none">
        <rect x="3" y="3" width="9" height="9" rx="2" fill="#ffffff"/>
        <rect x="16" y="3" width="9" height="9" rx="2" fill="#085041" opacity="0.9"/>
        <rect x="3" y="16" width="9" height="9" rx="2" fill="#085041" opacity="0.9"/>
        <rect x="5.5" y="5.5" width="4" height="4" rx="1" fill="#1D9E75"/>
        <rect x="18.5" y="5.5" width="4" height="4" rx="1" fill="#ffffff"/>
        <rect x="5.5" y="18.5" width="4" height="4" rx="1" fill="#ffffff"/>
        <rect x="16" y="16" width="4" height="4" rx="1" fill="#ffffff"/>
        <rect x="21" y="16" width="4" height="4" rx="1" fill="#ffffff"/>
        <rect x="16" y="21" width="4" height="4" rx="1" fill="#ffffff"/>
        <rect x="21" y="21" width="4" height="4" rx="1" fill="#5DCAA5"/>
      </svg>
      <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em;color:#ffffff;">Avi<span style="color:#5DCAA5;">QR</span></div>
    </div>

    <!-- headline block -->
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;max-width:820px;">
      <div style="font-size:88px;font-weight:900;line-height:1.04;letter-spacing:-0.03em;color:#ffffff;">
        Scan. Order.<br>Engage. Grow.
      </div>
      <div style="font-size:28px;font-weight:500;line-height:1.5;color:rgba(255,255,255,0.88);max-width:640px;">
        The QR-powered platform for restaurants, hotels &amp; malls across India — digital menu, live orders, and billing in one app.
      </div>
    </div>

    <!-- footer: plan badge + CTA -->
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,0.14);border:1.5px solid rgba(255,255,255,0.35);border-radius:999px;padding:14px 24px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span style="font-size:19px;font-weight:700;color:#ffffff;">Free Starter plan — no credit card</span>
      </div>
      <div style="font-size:24px;font-weight:800;color:#ffffff;letter-spacing:-0.01em;">aviqr.com</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
