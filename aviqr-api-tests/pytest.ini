[pytest]
addopts = -v --tb=short --strict-markers -p no:warnings
testpaths = .
markers =
    mutates: test creates/modifies persistent demo data (not read-only)
    smoke: lightweight sanity checks — run first, fail fast
    security: auth, RBAC, cross-tenant isolation tests
    billing: POS, KOT, invoice, payment tests
    inventory: stock, raw materials, recipe tests
    crm: loyalty, customer, CRM tests
    aggregator: Zomato/Swiggy webhook and mapping tests
    analytics: report and analytics endpoint tests
    slow: tests that take >2s (mutating + multi-step flows)
