<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="#FAFAFA"/>

  <!-- wordmark -->
  <g transform="translate(56,42)">
    <rect x="3" y="3" width="24" height="24" rx="5" fill="#1D9E75"/>
    <rect x="42" y="3" width="24" height="24" rx="5" fill="#0A0A0A" opacity="0.9"/>
    <rect x="3" y="42" width="24" height="24" rx="5" fill="#0A0A0A" opacity="0.9"/>
    <rect x="14.5" y="14.5" width="11" height="11" rx="2.5" fill="#ffffff"/>
    <rect x="49" y="14.5" width="11" height="11" rx="2.5" fill="#ffffff"/>
    <rect x="14.5" y="49" width="11" height="11" rx="2.5" fill="#ffffff"/>
    <rect x="42" y="42" width="11" height="11" rx="2.5" fill="#1D9E75"/>
    <rect x="55.5" y="42" width="11" height="11" rx="2.5" fill="#1D9E75"/>
    <rect x="42" y="55.5" width="11" height="11" rx="2.5" fill="#1D9E75"/>
    <rect x="55.5" y="55.5" width="11" height="11" rx="2.5" fill="#5DCAA5"/>
  </g>
  <text x="128" y="74" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#111111">Avi<tspan fill="#1D9E75">QR</tspan></text>

  <!-- eyebrow pill -->
  <rect x="56" y="118" width="392" height="42" rx="21" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="73" y="144" font-size="15" font-weight="700" letter-spacing="0.6" fill="#0F6E56">QR ORDERING &#183; 9 INDIAN LANGUAGES</text>

  <!-- headline -->
  <text x="55" y="228" font-size="46" font-weight="900" letter-spacing="-1" fill="#111111">Your table is</text>
  <text x="55" y="284" font-size="46" font-weight="900" letter-spacing="-1" fill="#111111">the menu now.</text>

  <!-- subhead -->
  <text x="56" y="330" font-size="19" font-weight="500" fill="#4A4A4A">Guests scan, browse, and order in their</text>
  <text x="56" y="358" font-size="19" font-weight="500" fill="#4A4A4A">own language. Orders hit the kitchen instantly.</text>

  <!-- CTA button -->
  <rect x="56" y="400" width="200" height="52" rx="26" fill="#1D9E75"/>
  <text x="156" y="433" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Try it free</text>

  <!-- domain -->
  <text x="56" y="490" font-size="22" font-weight="800" letter-spacing="-0.3" fill="#0F6E56">aviqr.com</text>

  <!-- feature card -->
  <rect x="612" y="50" width="532" height="527" rx="24" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- feature rows -->
  <g transform="translate(650,118)">
    <circle cx="14" cy="14" r="14" fill="#E1F5EE"/>
    <path d="M8 14 l4 4 8-9" stroke="#1D9E75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="40" y="19" font-size="19" font-weight="700" fill="#111111">Live orders &amp; KOTs straight</text>
    <text x="40" y="44" font-size="19" font-weight="700" fill="#111111">to the kitchen</text>
  </g>

  <g transform="translate(650,208)">
    <circle cx="14" cy="14" r="14" fill="#E1F5EE"/>
    <path d="M8 14 l4 4 8-9" stroke="#1D9E75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="40" y="19" font-size="19" font-weight="700" fill="#111111">Menu in 9 Indian languages,</text>
    <text x="40" y="44" font-size="19" font-weight="700" fill="#111111">auto-translated</text>
  </g>

  <g transform="translate(650,298)">
    <circle cx="14" cy="14" r="14" fill="#E1F5EE"/>
    <path d="M8 14 l4 4 8-9" stroke="#1D9E75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="40" y="19" font-size="19" font-weight="700" fill="#111111">11 AI features: smart search,</text>
    <text x="40" y="44" font-size="19" font-weight="700" fill="#111111">reviews, fraud checks</text>
  </g>

  <g transform="translate(650,388)">
    <circle cx="14" cy="14" r="14" fill="#E1F5EE"/>
    <path d="M8 14 l4 4 8-9" stroke="#1D9E75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="40" y="19" font-size="19" font-weight="700" fill="#111111">Built for Indian restaurants,</text>
    <text x="40" y="44" font-size="19" font-weight="700" fill="#111111">hotels &amp; malls</text>
  </g>
</svg>
