<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#FAFAFA"/>

  <!-- wordmark -->
  <g transform="translate(72,66)">
    <rect x="3" y="3" width="27" height="27" rx="6" fill="#1D9E75"/>
    <rect x="48" y="3" width="27" height="27" rx="6" fill="#0A0A0A" opacity="0.9"/>
    <rect x="3" y="48" width="27" height="27" rx="6" fill="#0A0A0A" opacity="0.9"/>
    <rect x="16.5" y="16.5" width="12" height="12" rx="3" fill="#ffffff"/>
    <rect x="55.5" y="16.5" width="12" height="12" rx="3" fill="#ffffff"/>
    <rect x="16.5" y="55.5" width="12" height="12" rx="3" fill="#ffffff"/>
    <rect x="48" y="48" width="12" height="12" rx="3" fill="#1D9E75"/>
    <rect x="63" y="48" width="12" height="12" rx="3" fill="#1D9E75"/>
    <rect x="48" y="63" width="12" height="12" rx="3" fill="#1D9E75"/>
    <rect x="63" y="63" width="12" height="12" rx="3" fill="#5DCAA5"/>
  </g>
  <text x="150" y="103" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#111111">Avi<tspan fill="#1D9E75">QR</tspan></text>

  <!-- eyebrow pill -->
  <rect x="72" y="168" width="336" height="46" rx="23" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="90" y="197" font-size="16" font-weight="700" letter-spacing="0.6" fill="#0F6E56">FREE TOOL &#183; NO SIGNUP</text>

  <!-- headline -->
  <text x="70" y="300" font-size="60" font-weight="900" letter-spacing="-1" fill="#111111">Turn any menu link</text>
  <text x="70" y="368" font-size="60" font-weight="900" letter-spacing="-1" fill="#111111">into a QR code.</text>

  <!-- subhead -->
  <text x="72" y="424" font-size="24" font-weight="500" fill="#4A4A4A">Paste a link — a PDF, Google Drive file, or website.</text>
  <text x="72" y="456" font-size="24" font-weight="500" fill="#4A4A4A">Get a downloadable QR code in seconds. Totally free.</text>

  <!-- tool mockup card -->
  <rect x="130" y="520" width="820" height="280" rx="24" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>

  <text x="172" y="580" font-size="15" font-weight="700" fill="#2D2D2D">Menu link</text>
  <rect x="172" y="598" width="480" height="52" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="192" y="630" font-size="17" fill="#9CA3AF">https://drive.google.com/...</text>

  <rect x="172" y="674" width="230" height="52" rx="26" fill="#1D9E75"/>
  <path d="M195 692 v14 M188 700 l7 7 7-7 M186 720 h18" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="216" y="708" font-size="16" font-weight="700" fill="#ffffff">Download PNG</text>

  <rect x="712" y="590" width="180" height="180" rx="16" fill="#FAFAFA"/>
  <g transform="translate(742,620)">
    <rect x="0" y="0" width="42" height="42" rx="6" fill="#111111"/>
    <rect x="60" y="0" width="42" height="42" rx="6" fill="#111111"/>
    <rect x="0" y="60" width="42" height="42" rx="6" fill="#111111"/>
    <rect x="10" y="10" width="22" height="22" rx="3" fill="#ffffff"/>
    <rect x="70" y="10" width="22" height="22" rx="3" fill="#ffffff"/>
    <rect x="10" y="70" width="22" height="22" rx="3" fill="#ffffff"/>
    <rect x="60" y="60" width="18" height="18" rx="3" fill="#1D9E75"/>
    <rect x="84" y="60" width="18" height="18" rx="3" fill="#111111"/>
    <rect x="60" y="84" width="18" height="18" rx="3" fill="#111111"/>
    <rect x="84" y="84" width="18" height="18" rx="3" fill="#1D9E75"/>
  </g>

  <!-- CTA -->
  <text x="540" y="980" font-size="24" font-weight="800" letter-spacing="-0.3" fill="#0F6E56" text-anchor="middle">aviqr.com/free-qr-menu-generator</text>
</svg>
