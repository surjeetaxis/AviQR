<!DOCTYPE html>
<!--
  Offline fallback page — served by the Service Worker (see public/sw.js)
  when a navigation request fails and nothing matching it is cached.

  Must be fully self-contained: no external stylesheets, fonts, or scripts.
  Anything network-dependent here would itself fail to load while offline.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F6E56" />
  <title>You're offline — AviQR</title>
  <style>
    :root {
      --green: #1D9E75;
      --green-dark: #0F6E56;
      --gray-900: #111111;
      --gray-500: #6B7280;
      --gray-200: #E5E7EB;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: var(--gray-900);
      text-align: center;
    }
    .card { max-width: 380px; }
    .mark {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--gray-900);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 8px;
      margin: 0 auto 24px;
    }
    .mark span { border-radius: 5px; }
    .mark span:nth-child(1) { background: var(--green); }
    .mark span:nth-child(2) { background: rgba(255,255,255,.92); }
    .mark span:nth-child(3) { background: rgba(255,255,255,.92); }
    .mark span:nth-child(4) { background: var(--green); opacity: .7; }
    h1 { font-size: 21px; font-weight: 800; margin: 0 0 8px; letter-spacing: -.01em; }
    p { font-size: 14.5px; color: var(--gray-500); line-height: 1.6; margin: 0 0 28px; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 46px;
      padding: 0 24px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--green-dark); }
    button:active { transform: translateY(1px); }
    .hint { margin-top: 18px; font-size: 12.5px; color: var(--gray-500); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1>You're offline</h1>
    <p>Can't reach AviQR right now. Check your connection — we'll reconnect automatically, or tap below to retry.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">This page will refresh on its own once you're back online.</div>
  </div>
  <script>
    // Auto-recover the moment connectivity returns — no need to wait for the user to tap Retry.
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
